<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MESA Authentication</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>

pe"], "body-lg": ["Manrope"], "nav-item": ["Manrope"], "body-md": ["Manrope"], "data-mono": ["JetBrains Mono"], "headline-lg": ["Manrope"], "label-md": ["JetBrains Mono"], "headline-lg-mobile": ["Manrope"]}, fontSize: {"headline-md": ["20px", {lineHeight: "28px", fontWeight: "600"}], "body-lg": ["16px", {lineHeight: "24px", fontWeight: "400"}], "nav-item": ["14px", {lineHeight: "20px", fontWeight: "500"}], "body-md": ["14px", {lineHeight: "20px", fontWeight: "400"}], "data-mono": ["13px", {lineHeight: "18px", letterSpacing: "-0.01em", fontWeight: "450"}], "headline-lg": ["24px", {lineHeight: "32px", fontWeight: "700"}], "label-md": ["12px", {lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "500"}], "headline-lg-mobile": ["20px", {lineHeight: "28px", fontWeight: "700"}]}}}};</script>

<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-4 relative overflow-hidden text-on-surface">
<!-- Geometric Background Pattern -->
<div class="absolute inset-0 pointer-events-none opacity-5 z-0" style="background-image: radial-gradient(circle at 2px 2px, #344AB7 1px, transparent 0); background-size: 32px 32px;"></div>
<!-- Centered Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl w-full max-w-[480px] p-8 relative z-10">
<!-- Header -->
<div class="text-center mb-8">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight mb-2">MESA</h1>
<p class="font-body-md text-body-md text-on-surface-variant">One Identity. Every Meal. Zero Friction.</p>
</div>
<!-- SSO Button -->
<button class="w-full bg-primary text-on-primary rounded-lg py-3 px-4 font-nav-item text-nav-item flex items-center justify-center gap-2 hover:bg-primary/90 transition-colors duration-200">
<span class="material-symbols-outlined text-[20px]" data-icon="shield_person">shield_person</span>
            Sign in with SSO
        </button>
<!-- Divider -->
<div class="flex items-center my-8">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="mx-4 font-body-md text-body-md text-on-surface-variant">or sign in with credentials</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Form -->
<form class="space-y-4">
<!-- Email Input -->
<div class="space-y-1">
<label class="font-nav-item text-nav-item text-on-surface" for="email">Email Address</label>
<input class="w-full bg-surface-container-lowest border border-outline rounded-lg py-2 px-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="email" name="email" placeholder="user@company.com" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="space-y-1">
<div class="flex justify-between items-center">
<label class="font-nav-item text-nav-item text-on-surface" for="password">Password</label>
<a class="font-body-md text-body-md text-primary hover:underline" href="#">Forgot password?</a>
</div>
<input class="w-full bg-surface-container-lowest border border-outline rounded-lg py-2 px-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-colors" id="password" name="password" required="" type="password"/>
</div>
<!-- Sign In Button -->
<button class="w-full bg-primary text-on-primary rounded-lg py-3 px-4 font-nav-item text-nav-item mt-6 hover:bg-primary/90 transition-colors duration-200" type="submit">
                Sign In
            </button>
</form>
<!-- Footer -->
<div class="mt-8 text-center">
<p class="font-data-mono text-data-mono text-on-surface-variant text-[11px] uppercase tracking-wider">MESA v1.0 — Secured by TLS 1.3</p>
</div>
</div>
</body></html>
